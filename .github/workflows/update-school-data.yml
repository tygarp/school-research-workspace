name: Update School CSV Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  update-school-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create data folder
        run: mkdir -p data

      - name: Download US school data
        run: |
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/nicelion/schools-and-districts/master/csv/schools.csv" \
            -o data/us-schools.csv

      - name: Download Thailand school data
        run: |
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/thrxpt/thai-school-data/main/dist/csv/schools.csv" \
            -o data/thailand-schools.csv

      - name: Check downloaded files
        run: |
          test -s data/us-schools.csv
          test -s data/thailand-schools.csv
          ls -lh data/

      - name: Commit updated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/us-schools.csv data/thailand-schools.csv

          if git diff --cached --quiet; then
            echo "No school data changes detected."
          else
            git commit -m "Update school CSV data"
            git push
          fi
